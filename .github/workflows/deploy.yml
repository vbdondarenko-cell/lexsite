name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Write Telegram bot config (from GitHub secrets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const q = (v) => "\x27" + String(v || "").replace(/\\/g, "\\\\").replace(/\x27/g, "\\\x27") + "\x27";
            const php = "<?php\nreturn array(\n  \x27TELEGRAM_BOT_TOKEN\x27 => " + q(process.env.TELEGRAM_BOT_TOKEN) + ",\n  \x27TELEGRAM_CHAT_ID\x27 => " + q(process.env.TELEGRAM_CHAT_ID) + ",\n);\n";
            fs.writeFileSync("dist/lead-config.php", php);
          '

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:reconnect-interval-base 5;
            set net:max-retries 3;
            open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }};
            mirror --reverse --delete --verbose dist/ public_html/;
            bye
          "
