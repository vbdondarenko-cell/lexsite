name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Write Telegram bot config (from GitHub secrets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = { TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN || "", TELEGRAM_CHAT_ID: process.env.TELEGRAM_CHAT_ID || "" };
            fs.writeFileSync("dist/api/config.php", "<?php\nreturn json_decode(<<<'"'"'J'"'"'\n" + JSON.stringify(cfg) + "\nJ, true);\n");
          '

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:reconnect-interval-base 5;
            set net:max-retries 3;
            open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }};
            mirror --reverse --delete --verbose dist/ public_html/;
            bye
          "
